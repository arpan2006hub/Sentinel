# =============================================================================
# Sentinel — Docker Compose
# =============================================================================
# Current local-first build:
#   backend   — FastAPI + AI layer (SQLite + local evidence store in a volume)
#
# Planned (not used by the code yet, kept for the roadmap):
#   frontend  — React investigator dashboard (Dockerfile owned by the frontend team)
#   postgres / redis / worker — PostgreSQL + Celery once SQLite/BackgroundTasks are outgrown
#   mlflow    — experiment tracking
#
# Usage:
#   docker compose --profile app up --build backend      # API on http://localhost:8000
#   docker compose --profile planned up postgres redis   # future infrastructure only
#   docker compose --profile mlops up mlflow
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Backend (FastAPI) — IMPLEMENTED
  # Build context is the project root because the API imports the ai/ package.
  # TimeSformer weights (~485 MB) are downloaded on demand into the volume
  # (POST /api/video/download-weights) or mount an existing file at
  # /data/models/timesformer/model.pth.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_TORCH: "true"
    image: sentinel-backend:latest
    container_name: sentinel-backend
    restart: unless-stopped
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-500}
      VIDEO_MAX_SECONDS: ${VIDEO_MAX_SECONDS:-120}
      VIDEO_AUTO_DOWNLOAD: ${VIDEO_AUTO_DOWNLOAD:-false}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - sentinel-data:/data
    profiles:
      - app

  # ---------------------------------------------------------------------------
  # Frontend (React + Vite) — NOT YET IMPLEMENTED (frontend team)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile        # to be created by the frontend team
    container_name: sentinel-frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    profiles:
      - frontend

  # ---------------------------------------------------------------------------
  # PLANNED infrastructure (not used by the current code)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: sentinel-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    profiles:
      - planned

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    profiles:
      - planned

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    container_name: sentinel-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlops/mlflow:/mlflow
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri /mlflow
    profiles:
      - mlops

volumes:
  sentinel-data:
  postgres-data:
  redis-data:
